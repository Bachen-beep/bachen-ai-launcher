name: Signed Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)(?<suffix>-stage(?:2|6)-(?:preview|rc\d+))?$') { throw "Invalid release tag: $tag" }
          [xml]$project = Get-Content ".\BaChen AI Launcher.csproj"
          if ($project.Project.PropertyGroup.Version[0] -ne $Matches.version) {
            throw "Tag version $($Matches.version) does not match project version $($project.Project.PropertyGroup.Version[0])."
          }
          $isPrerelease = -not [string]::IsNullOrEmpty($Matches.suffix)
          $releaseNotes = "Docs/ReleaseNotes-$($Matches.version)$($Matches.suffix).md"
          if (-not (Test-Path $releaseNotes)) {
            throw ("Release notes are required for {0}: {1}" -f $tag, $releaseNotes)
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_notes=$releaseNotes" >> $env:GITHUB_OUTPUT

      - name: Verify release commit is on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tags must point to a commit on main." }

      - name: Build and self-test
        shell: pwsh
        run: |
          dotnet build ".\BaChen AI Launcher.csproj" -c Release
          $report = Join-Path $env:RUNNER_TEMP "launcher-self-tests.txt"
          dotnet ".\bin\Release\net10.0-windows\BaChen AI Launcher.dll" --self-test $report
          if ($LASTEXITCODE -ne 0) { Get-Content $report; exit $LASTEXITCODE }
          Get-Content $report
          .\scripts\Publish.ps1

      - name: Restore Authenticode certificate
        id: certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            "available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP "bachen-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "available=true" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Authenticode sign launcher
        if: steps.certificate.outputs.available == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found." }
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "${{ steps.certificate.outputs.path }}" /p $env:PFX_PASSWORD ".\artifacts\release\BaChen AI Launcher.exe"
          if ($LASTEXITCODE -ne 0) { throw "Launcher signing failed." }
          $signature = Get-AuthenticodeSignature ".\artifacts\release\BaChen AI Launcher.exe"
          if ($signature.Status -ne "Valid") { throw "Launcher signature verification failed: $($signature.Status)" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and update manifest
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.LAUNCHER_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_BASE64)) { throw "LAUNCHER_UPDATE_PRIVATE_KEY_BASE64 is required." }
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          .\scripts\Build-Installer.ps1 -Version $version
          Copy-Item ".\artifacts\release\BaChen AI Launcher.exe" ".\artifacts\BaChen.AI.Launcher.exe"
          Copy-Item ".\Catalog\plugin-index.json" ".\artifacts\plugin-index.json"
          $keyPath = Join-Path $env:RUNNER_TEMP "launcher-update-private.pem"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:UPDATE_PRIVATE_KEY_BASE64))
          .\scripts\New-UpdateManifest.ps1 `
            -Version $version `
            -ExecutablePath ".\artifacts\BaChen.AI.Launcher.exe" `
            -DownloadUrl "https://github.com/${{ github.repository }}/releases/download/$tag/BaChen.AI.Launcher.exe" `
            -ReleaseNotesUrl "https://github.com/${{ github.repository }}/releases/tag/$tag" `
            -PrivateKeyPath $keyPath `
            -OutputPath ".\artifacts\launcher-update.json"

      - name: Authenticode sign installer
        if: steps.certificate.outputs.available == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          $installer = Get-Item ".\artifacts\installer\BaChen-AI-Launcher-Setup-${{ steps.version.outputs.version }}.exe"
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "${{ steps.certificate.outputs.path }}" /p $env:PFX_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne "Valid") { throw "Installer signature verification failed." }

      - name: Test standalone and installed distribution
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $evidenceRoot = Join-Path $PWD "artifacts\test-evidence"
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $report = Join-Path $evidenceRoot "distribution-test.txt"
          .\scripts\Test-Distribution.ps1 `
            -LauncherPath ".\artifacts\BaChen.AI.Launcher.exe" `
            -InstallerPath ".\artifacts\installer\BaChen-AI-Launcher-Setup-$version.exe" `
            -ReportPath $report
          Get-Content $report

      - name: Test standard user with Unicode username
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $report = Join-Path $PWD "artifacts\test-evidence\standard-user-distribution-test.txt"
          .\scripts\Test-StandardUserDistribution.ps1 `
            -LauncherPath ".\artifacts\BaChen.AI.Launcher.exe" `
            -InstallerPath ".\artifacts\installer\BaChen-AI-Launcher-Setup-$version.exe" `
            -ReportPath $report
          Get-Content $report

      - name: Retain qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-qualification-${{ steps.version.outputs.version }}
          path: artifacts/test-evidence/*.txt
          if-no-files-found: error
          retention-days: 90

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: artifacts/release
          format: spdx-json
          output-file: artifacts/BaChen-AI-Launcher.spdx.json
          upload-artifact: false

      - name: Generate final checksums
        shell: pwsh
        run: |
          $installer = Get-Item ".\artifacts\installer\BaChen-AI-Launcher-Setup-${{ steps.version.outputs.version }}.exe"
          $checksums = @(
            "$((Get-FileHash '.\artifacts\BaChen.AI.Launcher.exe' -Algorithm SHA256).Hash)  BaChen.AI.Launcher.exe",
            "$((Get-FileHash $installer.FullName -Algorithm SHA256).Hash)  $($installer.Name)",
            "$((Get-FileHash '.\artifacts\launcher-update.json' -Algorithm SHA256).Hash)  launcher-update.json",
            "$((Get-FileHash '.\artifacts\plugin-index.json' -Algorithm SHA256).Hash)  plugin-index.json",
            "$((Get-FileHash '.\artifacts\BaChen-AI-Launcher.spdx.json' -Algorithm SHA256).Hash)  BaChen-AI-Launcher.spdx.json"
          )
          [IO.File]::WriteAllLines((Join-Path $PWD "artifacts\SHA256SUMS.txt"), $checksums)

      - name: Attest standalone launcher provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/BaChen.AI.Launcher.exe

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/installer/BaChen-AI-Launcher-Setup-${{ steps.version.outputs.version }}.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body_path: ${{ steps.version.outputs.release_notes }}
          files: |
            artifacts/BaChen.AI.Launcher.exe
            artifacts/installer/BaChen-AI-Launcher-Setup-${{ steps.version.outputs.version }}.exe
            artifacts/launcher-update.json
            artifacts/plugin-index.json
            artifacts/SHA256SUMS.txt
            artifacts/BaChen-AI-Launcher.spdx.json

      - name: Publish completed draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            "release", "edit", "${{ github.ref_name }}",
            "--repo", "${{ github.repository }}",
            "--draft=false"
          )
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") {
            $arguments += "--prerelease"
          }
          else {
            $arguments += "--latest"
          }
          gh @arguments

      - name: Verify published assets and attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "published-release"
          New-Item -ItemType Directory -Path $verifyRoot | Out-Null
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir $verifyRoot
          $expected = @{}
          foreach ($line in Get-Content (Join-Path $verifyRoot "SHA256SUMS.txt")) {
            if ($line -match '^(?<hash>[A-Fa-f0-9]{64})\s{2}(?<name>.+)$') {
              $expected[$Matches.name] = $Matches.hash
            }
          }
          foreach ($name in @("BaChen.AI.Launcher.exe", "BaChen-AI-Launcher-Setup-${{ steps.version.outputs.version }}.exe", "launcher-update.json", "plugin-index.json", "BaChen-AI-Launcher.spdx.json")) {
            $actual = (Get-FileHash (Join-Path $verifyRoot $name) -Algorithm SHA256).Hash
            if (-not $expected.ContainsKey($name) -or $actual -ne $expected[$name]) {
              throw "Published SHA-256 verification failed for $name."
            }
          }
          gh attestation verify (Join-Path $verifyRoot "BaChen.AI.Launcher.exe") --repo "${{ github.repository }}"
          gh attestation verify (Join-Path $verifyRoot "BaChen-AI-Launcher-Setup-${{ steps.version.outputs.version }}.exe") --repo "${{ github.repository }}"
